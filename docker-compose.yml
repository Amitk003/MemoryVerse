services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/backend/uploads
      - chroma_data:/app/backend/chroma_data
      - data_db:/app/backend/data
    env_file:
      - ./backend/.env
    environment:
      - SECRET_KEY=${SECRET_KEY:-default-secret-key-change-in-production}
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
  chroma_data:
  data_db:
